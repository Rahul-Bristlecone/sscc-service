[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sscc-service"
version = "0.1.0"
description = "SSCC Service for generating GS1 Serial Shipping Container Codes and shipping labels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.0",
    "marshmallow>=3.21.0",
    "flask-marshmallow>=1.2.0",
    "python-barcode[images]>=0.15.1",
    "reportlab>=4.2.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "Pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-flask>=1.3.0",
    "coverage>=7.5.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
