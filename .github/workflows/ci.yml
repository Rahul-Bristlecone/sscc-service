name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest --cov=sscc --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/ tests/

  docker:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sscc-service:${{ github.sha }} .
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1   # adjust to your region

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 \
          | docker login --username AWS --password-stdin <account_id>.dkr.ecr.ap-south-1.amazonaws.com

      - name: Tag and Push Docker image
        run: |
          docker tag sscc-service:${{ github.sha }} <account_id>.dkr.ecr.ap-south-1.amazonaws.com/sscc-lambda:${{ github.sha }}
          docker push <account_id>.dkr.ecr.ap-south-1.amazonaws.com/sscc-lambda:${{ github.sha }}
      
      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name sscc-generate-lambda \
            --image-uri <account_id>.dkr.ecr.ap-south-1.amazonaws.com/sscc-lambda:${{ github.sha }}